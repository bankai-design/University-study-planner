<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('authBP.static', filename='css/styles.css')}}">
    <title>Register</title>
</head>
<body>
    <div class="parent">

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul>
                    {% for message in messages %}
                        <li style="color: red;">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form class="child" method="POST">
            <p class="font">Email</p>
            <input type="text" name="email">
            <p class="font">Create password</p>
            <input class="pass" type="text" name="pass1">
            <p class="font">Confirm password</p>
            <input class="pass" type="text" name="pass2">

            <p></p>
            <input type="submit" value="Register">

            <a class="link" href="login">Already have an account? Click here!</a>
        </form>

    </div>
</body>
</html>
